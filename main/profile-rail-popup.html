<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfiles</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1c1b22;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f2f2f4;
      --muted: rgba(242, 242, 244, 0.55);
      --hover: rgba(255, 255, 255, 0.08);
    }
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font: 13px/1.3 "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
    }
    .menu {
      box-sizing: border-box;
      width: 100%;
      max-height: 100%;
      overflow: auto;
      padding: 6px;
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 12px 12px;
      background: var(--bg);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55);
      transform-origin: top center;
      animation: slide-in 200ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes slide-in {
      from {
        opacity: 0;
        transform: translateY(-100%);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .menu {
        animation: none;
      }
    }
    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin: 0;
      padding: 6px 8px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .item:hover,
    .item.is-active {
      background: var(--hover);
    }
    .check {
      flex: 0 0 14px;
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.9;
    }
    .check:empty {
      visibility: hidden;
    }
    .avatar {
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      overflow: hidden;
      background: #3a3a48;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .text {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1 1 auto;
      gap: 1px;
    }
    .label,
    .detail {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .label {
      font-weight: 600;
    }
    .detail {
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div id="menu" class="menu" role="menu"></div>
  <script src="profile-rail-popup-renderer.js"></script>
</body>
</html>
