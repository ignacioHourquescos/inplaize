<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:" />
    <title>Gestor de contraseñas</title>
    <link rel="stylesheet" href="passwords.css" />
  </head>
  <body>
    <main class="page">
      <header class="head">
        <h1>Contraseñas</h1>
        <button type="button" class="btn primary" id="add-btn">Agregar</button>
      </header>

      <p class="warning" id="encrypt-warning" hidden>
        El cifrado del sistema no está disponible: no se pueden guardar contraseñas nuevas.
      </p>

      <section class="settings">
        <label class="toggle">
          <input type="checkbox" id="offer-to-save" />
          <span>Ofrecer guardar contraseñas</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="autofill" />
          <span>Completar el inicio de sesión automáticamente</span>
        </label>
      </section>

      <input type="search" class="search" id="search" placeholder="Buscar sitio o usuario" spellcheck="false" />

      <form class="editor" id="editor" hidden autocomplete="off">
        <h2 id="editor-title">Agregar contraseña</h2>
        <label class="field" id="site-field">
          <span>Sitio</span>
          <input type="text" id="editor-site" placeholder="ejemplo.com" spellcheck="false" />
        </label>
        <label class="field">
          <span>Usuario</span>
          <input type="text" id="editor-username" spellcheck="false" />
        </label>
        <label class="field">
          <span>Contraseña</span>
          <input type="password" id="editor-password" />
        </label>
        <p class="error" id="editor-error" hidden></p>
        <div class="editor-actions">
          <button type="button" class="btn" id="editor-cancel">Cancelar</button>
          <button type="submit" class="btn primary">Guardar</button>
        </div>
      </form>

      <section>
        <ul class="list" id="list"></ul>
        <p class="empty" id="empty" hidden>Todavía no hay contraseñas guardadas.</p>
      </section>

      <section class="never" id="never-section" hidden>
        <h2>Nunca se guardan</h2>
        <ul class="list" id="never-list"></ul>
      </section>
    </main>
    <script src="passwords-renderer.js"></script>
  </body>
</html>
