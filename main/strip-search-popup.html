<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscar</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1c1b22;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f2f2f4;
      --muted: rgba(242, 242, 244, 0.55);
      --field: rgba(255, 255, 255, 0.06);
    }
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font: 13px/1.3 "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
    }
    .panel {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 12px 12px;
      background: var(--bg);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55);
      transform-origin: top center;
      animation: slide-in 200ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes slide-in {
      from {
        opacity: 0;
        transform: translateY(-100%);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .panel {
        animation: none;
      }
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 12px 0 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--field);
    }
    .row svg {
      flex: 0 0 16px;
      width: 16px;
      height: 16px;
      color: var(--muted);
    }
    .row input {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
      margin: 0;
      padding: 0;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      -webkit-user-select: text;
      user-select: text;
    }
    .row input::placeholder {
      color: var(--muted);
      font-weight: 400;
    }
  </style>
</head>
<body>
  <form id="panel" class="panel" autocomplete="off">
    <label class="row">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6" stroke="currentColor" stroke-width="2.2"/>
        <path d="M15.2 15.2 20 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <input id="q" type="text" placeholder="Buscá en Google o escribí un enlace" spellcheck="false" enterkeyhint="go" />
    </label>
  </form>
  <script src="strip-search-popup-renderer.js"></script>
</body>
</html>
