# Publica la carpeta landing/ en GitHub Pages (sitio estático).
# Requisito: en el repo → Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Deploy landing to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-landing-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site (landing/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
