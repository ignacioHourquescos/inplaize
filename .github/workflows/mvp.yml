# Arma el zip de Windows del MVP para pasárselo a alguien.
# El artefacto queda en la corrida de Actions: inplaize-mvp-windows.

name: MVP

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/mvp-dbc4

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm run test:mvp

      - name: Zip de Windows
        run: npm run build:mvp
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publicar el artefacto
        uses: actions/upload-artifact@v4
        with:
          name: inplaize-mvp-windows
          path: release/mvp/*.zip
          if-no-files-found: error
