<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>inplaize</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Miranda+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shell-home-menu.css" />
  <link rel="stylesheet" href="web-shell.css" />
  <link rel="stylesheet" href="strip-chrome-lock.css" />
  <script src="canvas-theme.js"></script>
</head>
<body>
  <header class="shell-top" role="banner">
    <div class="strip-url-cluster">
    <button
      type="button"
      id="shell-home-btn"
      class="shell-home-strip-btn shell-shortcut-item"
      aria-pressed="false"
      data-tooltip="inplaize"
      data-tooltip-placement="bottom"
      aria-label="Abrir inplaize"
    >
      <span class="dock-home-logo-mark" aria-hidden="true">
        <svg class="logo-mark" viewBox="0 0 26 26" aria-hidden="true" focusable="false">
          <rect x="7.5" y="7.5" width="11" height="11" rx="3" fill="currentColor"/>
          <circle cx="13" cy="13" r="2" fill="var(--ud-chrome-strip-bg)"/>
        </svg>
      </span>
    </button>
    <button
      type="button"
      id="shell-downloads-btn"
      class="shell-downloads-strip-btn shell-shortcut-item"
      aria-pressed="false"
      data-tooltip="Descargas"
      data-tooltip-placement="bottom"
      aria-label="Descargas"
    >
      <span class="dock-home-logo-mark" aria-hidden="true">
        <svg class="logo-mark" viewBox="0 0 26 26" fill="none" aria-hidden="true" focusable="false">
          <path d="M13 6.5v11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M8.5 13.5 13 18l4.5-4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </button>
    <div class="strip-rail-divider strip-search-divider" aria-hidden="true"></div>
    <div class="strip-leading">
    <form id="strip-profile-search" class="strip-profile-search" autocomplete="off" hidden>
      <span class="strip-profile-search-field">
      <button
        type="button"
        class="strip-profile-search-lupa"
        data-tooltip="Buscar con el perfil principal"
        data-tooltip-placement="bottom"
        aria-label="Buscar con el perfil principal"
        aria-expanded="false"
      >
        <span class="strip-search-mark" aria-hidden="true">
          <svg class="strip-profile-search-icon" viewBox="0 0 24 24" fill="none">
            <circle cx="10.5" cy="10.5" r="5.6" stroke="currentColor" stroke-width="2.3"/>
            <path d="M14.8 14.8 19.2 19.2" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
          </svg>
        </span>
      </button>
      <input
        type="text"
        class="strip-profile-search-input"
        spellcheck="false"
        autocomplete="off"
        enterkeyhint="search"
        aria-label="Buscar con el perfil principal"
        placeholder="Buscar"
        tabindex="-1"
      />
      <span class="strip-profile-search-avatar"></span>
      </span>
    </form>
    <nav id="loose-nav-accounts" class="loose-nav-accounts" aria-label="Perfiles de navegación"></nav>
    </div>
    </div>
    <button
      type="button"
      id="strip-search"
      class="strip-search"
      data-tooltip="Mostrar pestañas"
      data-tooltip-placement="bottom"
      aria-label="Mostrar la barra de pestañas"
      aria-expanded="false"
    >
      <span class="strip-search-line" aria-hidden="true"></span>
      <span class="strip-search-mark" aria-hidden="true">
        <svg class="strip-search-icon" viewBox="0 0 24 24" fill="none">
          <path d="M6.5 9.5 12 15l5.5-5.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </button>
    <div id="shortcut-strip" class="shortcut-strip" role="toolbar" aria-label="Accesos directos">
    <div id="strip-end-actions" class="strip-end-actions">
      <button
        type="button"
        id="strip-add-new"
        class="shell-shortcut-item strip-add-shortcut"
        data-tooltip="Agregar acceso directo o perfil"
        data-tooltip-placement="bottom"
        aria-label="Agregar acceso directo o perfil"
        hidden
      >
        <span class="shell-shortcut-icon-wrap" aria-hidden="true">
          <svg class="strip-add-plus" viewBox="0 0 24 24" fill="none">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </span>
      </button>
      <button
        type="button"
        id="strip-edit-toggle"
        class="shell-shortcut-item strip-add-shortcut"
        data-tooltip="Editar accesos y perfiles"
        data-tooltip-placement="bottom"
        aria-label="Editar accesos y perfiles"
      >
        <span class="shell-shortcut-icon-wrap" aria-hidden="true">
          <svg class="strip-add-plus" viewBox="0 0 24 24" fill="none">
            <path d="M4 20h4L19 9a2.83 2.83 0 0 0-4-4L4 16z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="m13.5 6.5 4 4" stroke="currentColor" stroke-width="2"/>
          </svg>
        </span>
      </button>
      <button
        type="button"
        id="strip-edit-done"
        class="shell-shortcut-item strip-add-shortcut strip-edit-done"
        data-tooltip="Terminar edición"
        data-tooltip-placement="bottom"
        aria-label="Terminar edición"
        hidden
      >
        <span class="shell-shortcut-icon-wrap" aria-hidden="true">
          <svg class="strip-add-plus" viewBox="0 0 24 24" fill="none">
            <path d="m5 12.5 4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>
    </div>
    </div>
    <div class="shell-win-btns" aria-label="Controles de ventana">
      <button type="button" id="shell-win-min" class="shell-win-btn" data-tooltip="Minimizar" data-tooltip-placement="bottom" aria-label="Minimizar">&#8722;</button>
      <button type="button" id="shell-win-max" class="shell-win-btn" data-tooltip="Maximizar" data-tooltip-placement="bottom" aria-label="Maximizar">&#9633;</button>
      <button type="button" id="shell-win-close" class="shell-win-btn is-close" data-tooltip="Cerrar ventana" data-tooltip-placement="bottom" aria-label="Cerrar ventana">&#215;</button>
    </div>
  </header>
  <script src="ui-tooltip.js"></script>
  <script src="profile-rail-menu.js"></script>
  <script src="shell-nav-profiles.js"></script>
  <script src="strip-search.js"></script>
  <script src="strip-chrome-lock.js"></script>
  <script src="strip-profile-search.js"></script>
  <script src="strip-gestures.js"></script>
  <script src="shell-home-menu.js"></script>
  <script src="tab-strip-fit.js"></script>
  <script src="workspace-folder.js"></script>
  <script src="web-shell-renderer.js"></script>
</body>
</html>
