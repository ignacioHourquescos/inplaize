<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>inplaize</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Miranda+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shell-home-menu.css" />
  <link rel="stylesheet" href="web-shell.css" />
  <script src="canvas-theme.js"></script>
</head>
<body>
  <header class="shell-top" role="banner">
    <button
      type="button"
      id="shell-home-btn"
      class="shell-home-strip-btn shell-shortcut-item"
      aria-pressed="false"
      data-tooltip="inplaize"
      data-tooltip-placement="bottom"
      aria-label="Abrir inplaize"
    >
      <span class="dock-home-logo-mark" aria-hidden="true"></span>
    </button>
    <div class="strip-leading">
    <nav id="loose-nav-accounts" class="loose-nav-accounts" aria-label="Perfiles de navegación"></nav>
    <div class="strip-rail-divider strip-search-divider" aria-hidden="true"></div>
    <button
      type="button"
      id="strip-search"
      class="strip-search"
      data-tooltip="Buscar"
      data-tooltip-placement="bottom"
      aria-label="Buscar"
    >
      <svg class="strip-search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6" stroke="currentColor" stroke-width="2.2"/>
        <path d="M15.2 15.2 20 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </button>
    </div>
    <div class="strip-rail-divider" aria-hidden="true"></div>
    <div id="shortcut-strip" class="shortcut-strip" role="toolbar" aria-label="Accesos directos">
    <div id="strip-end-actions" class="strip-end-actions">
      <button
        type="button"
        id="strip-add-new"
        class="shell-shortcut-item strip-add-shortcut"
        data-tooltip="Agregar acceso directo o perfil"
        data-tooltip-placement="bottom"
        aria-label="Agregar acceso directo o perfil"
        hidden
      >
        <span class="shell-shortcut-icon-wrap" aria-hidden="true">
          <svg class="strip-add-plus" viewBox="0 0 24 24" fill="none">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </span>
      </button>
      <button
        type="button"
        id="strip-edit-toggle"
        class="shell-shortcut-item strip-add-shortcut"
        data-tooltip="Editar accesos y perfiles"
        data-tooltip-placement="bottom"
        aria-label="Editar accesos y perfiles"
      >
        <span class="shell-shortcut-icon-wrap" aria-hidden="true">
          <svg class="strip-add-plus" viewBox="0 0 24 24" fill="none">
            <path d="M4 20h4L19 9a2.83 2.83 0 0 0-4-4L4 16z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="m13.5 6.5 4 4" stroke="currentColor" stroke-width="2"/>
          </svg>
        </span>
      </button>
      <button
        type="button"
        id="strip-edit-done"
        class="shell-shortcut-item strip-add-shortcut strip-edit-done"
        data-tooltip="Terminar edición"
        data-tooltip-placement="bottom"
        aria-label="Terminar edición"
        hidden
      >
        <span class="shell-shortcut-icon-wrap" aria-hidden="true">
          <svg class="strip-add-plus" viewBox="0 0 24 24" fill="none">
            <path d="m5 12.5 4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>
    </div>
    </div>
    <div class="shell-win-btns" aria-label="Controles de ventana">
      <button type="button" id="shell-win-min" class="shell-win-btn" data-tooltip="Minimizar" data-tooltip-placement="bottom" aria-label="Minimizar">&#8722;</button>
      <button type="button" id="shell-win-max" class="shell-win-btn" data-tooltip="Maximizar" data-tooltip-placement="bottom" aria-label="Maximizar">&#9633;</button>
      <button type="button" id="shell-win-close" class="shell-win-btn is-close" data-tooltip="Cerrar ventana" data-tooltip-placement="bottom" aria-label="Cerrar ventana">&#215;</button>
    </div>
  </header>
  <script src="ui-tooltip.js"></script>
  <script src="profile-rail-menu.js"></script>
  <script src="shell-nav-profiles.js"></script>
  <script src="strip-search.js"></script>
  <script src="strip-gestures.js"></script>
  <script src="shell-home-menu.js"></script>
  <script src="tab-strip-fit.js"></script>
  <script src="web-shell-renderer.js"></script>
</body>
</html>
