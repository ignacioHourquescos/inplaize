<!DOCTYPE html>
<html lang="es" data-usualdesk-detached-host="true">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>inplaize</title>
  <link rel="stylesheet" href="shell-home-menu.css" />
  <link rel="stylesheet" href="web-shell.css" />
</head>
<body>
  <header class="shell-top" role="banner">
    <button
      type="button"
      id="shell-home-btn"
      class="shell-home-strip-btn shell-shortcut-item"
      data-tooltip="Tareas"
      data-tooltip-placement="bottom"
      aria-label="Abrir tareas"
    >
      <span class="dock-home-logo-mark" aria-hidden="true"></span>
    </button>
    <button
      type="button"
      id="shell-downloads-btn"
      class="shell-downloads-strip-btn shell-shortcut-item"
      data-tooltip="Descargas"
      data-tooltip-placement="bottom"
      aria-label="Abrir descargas"
    >
      <svg class="dock-downloads-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 4v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M6 12l6 7 6-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="open-url-slot" id="open-url-slot">
      <button
        type="button"
        id="open-url-btn"
        class="shell-shortcut-item open-url-btn"
        data-tooltip="Internet"
        data-tooltip-placement="bottom"
        aria-label="Abrir el navegador"
      >
        <svg class="open-url-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/>
          <path d="M4 12h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M12 4c2.2 2.4 3.3 5.1 3.3 8s-1.1 5.6-3.3 8c-2.2-2.4-3.3-5.1-3.3-8s1.1-5.6 3.3-8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </button>
      <form id="open-url-form" class="open-url-form" hidden autocomplete="off">
        <div class="open-url-card">
          <input
            id="open-url-input"
            class="open-url-input"
            type="text"
            placeholder="Pegar enlace"
            spellcheck="false"
            enterkeyhint="go"
            aria-label="Enlace para abrir"
          />
        </div>
        <p class="open-url-error" hidden></p>
      </form>
    </div>
    <div id="shortcut-strip" class="shortcut-strip" role="toolbar" aria-label="Accesos directos">
    <button
      type="button"
      id="strip-add-shortcut"
      class="shell-shortcut-item strip-add-shortcut"
      data-tooltip="Añadir acceso directo"
      data-tooltip-placement="bottom"
      aria-label="Añadir acceso directo"
    >
      <span class="shell-shortcut-icon-wrap" aria-hidden="true">
        <svg class="strip-add-plus" viewBox="0 0 24 24" fill="none">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </span>
    </button>
    </div>
    <div class="shell-win-btns" aria-label="Controles de ventana">
      <button type="button" id="shell-win-min" class="shell-win-btn" data-tooltip="Minimizar" data-tooltip-placement="bottom" aria-label="Minimizar">&#8722;</button>
      <button type="button" id="shell-win-max" class="shell-win-btn" data-tooltip="Maximizar" data-tooltip-placement="bottom" aria-label="Maximizar">&#9633;</button>
      <button type="button" id="shell-win-close" class="shell-win-btn is-close" data-tooltip="Cerrar ventana" data-tooltip-placement="bottom" aria-label="Cerrar ventana">&#215;</button>
    </div>
  </header>
  <div id="subtab-strip" class="subtab-strip" role="tablist" aria-label="Pestañas" hidden></div>
  <script src="ui-tooltip.js"></script>
  <script src="open-url-bar.js"></script>
  <script src="strip-gestures.js"></script>
  <script src="shell-home-menu.js"></script>
  <script src="detached-web-frame-renderer.js"></script>
</body>
</html>
